<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHAPTER SELECT</title>
<style>
:root{--bg:#080808;--text:#f3f3f3;--muted:#747474;--line:#242424;--hover:#151515}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;min-height:100dvh;padding:max(32px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;justify-content:center;align-items:flex-start}
.wrap{width:min(760px,100%);padding-top:clamp(38px,9vh,108px);padding-bottom:60px}
.eyebrow{font-size:11px;letter-spacing:.28em;color:#707070;margin-bottom:12px}
h1{margin:0;font-size:clamp(36px,8vw,64px);line-height:.95;letter-spacing:-.045em;font-weight:800}
.intro{margin:20px 0 38px;max-width:560px;color:#969696;font-size:13px;line-height:1.8;letter-spacing:.04em}
.chapter-list{border-top:1px solid var(--line)}
.chapter{border-bottom:1px solid var(--line);min-height:76px}
.chapter a,.chapter .locked{width:100%;min-height:76px;padding:17px 4px;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;text-decoration:none;color:inherit}
.chapter a{transition:background .18s ease,padding-left .18s ease}
.chapter a:hover{background:var(--hover);padding-left:12px}
.num{color:#555;font-size:11px;letter-spacing:.12em}
.title{font-size:clamp(19px,4.8vw,27px);font-weight:700;line-height:1.15;letter-spacing:-.025em}
.state{font-size:9px;letter-spacing:.18em;white-space:nowrap;color:#777}
.chapter.enabled .state{color:#ddd}
.chapter.disabled{color:#555}
.chapter.disabled .title{color:#5d5d5d}
.chapter.disabled .locked{cursor:not-allowed;user-select:none}
.footer{margin-top:34px;display:flex;justify-content:space-between;gap:20px;color:#555;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
@media(max-width:560px){
  .wrap{padding-top:48px}
  .chapter,.chapter a,.chapter .locked{min-height:70px}
  .chapter a,.chapter .locked{grid-template-columns:34px 1fr auto;gap:8px}
  .state{font-size:8px;letter-spacing:.10em}
  .footer{flex-direction:column;gap:8px}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">STORY ARCHIVE / 07 CHAPTERS</div>
  <h1>CHAPTER<br>SELECT</h1>
  <p class="intro">選擇章節進入故事。尚未公開的章節會保留在列表中，開放後即可直接進入閱讀。</p>
  <section class="chapter-list" id="chapterList"></section>
  <footer class="footer"><span>Seven Chapters</span><span>Interactive Fiction</span></footer>
</main>

<script>
/*
============================================================
設計者設定區
============================================================
enabled: true  = 開放章節，可以點擊
enabled: false = 關閉章節，只顯示章節名稱

之後要公開某一章時，只要把 false 改成 true 即可。
每一章 HTML 檔放在 index.html 的同一個資料夾。
============================================================
*/
const chapters = [
  { title:"HALAZIA", file:"HALAZIA.html", enabled:true },
  { title:"WORK", file:"WORK.html", enabled:false },
  { title:"Adrenaline", file:"Adrenaline.html", enabled:false },
  { title:"Lemon Drop", file:"Lemon Drop.html", enabled:false },
  { title:"BOUNCY", file:"BOUNCY.html", enabled:false },
  { title:"Ice On My Teeth", file:"Ice On My Teeth.html", enabled:false },
  { title:"In Your Fantasy", file:"In Your Fantasy.html", enabled:false }
];

const list=document.getElementById("chapterList");
chapters.forEach((chapter,i)=>{
  const item=document.createElement("div");
  item.className="chapter "+(chapter.enabled?"enabled":"disabled");
  const number=String(i+1).padStart(2,"0");

  if(chapter.enabled){
    const link=document.createElement("a");
    link.href=chapter.file;
    link.setAttribute("aria-label","進入 "+chapter.title);
    link.innerHTML=`<span class="num">${number}</span><span class="title">${chapter.title}</span><span class="state">ENTER ↗</span>`;
    item.appendChild(link);
  }else{
    const locked=document.createElement("div");
    locked.className="locked";
    locked.setAttribute("aria-disabled","true");
    locked.innerHTML=`<span class="num">${number}</span><span class="title">${chapter.title}</span><span class="state">LOCKED</span>`;
    item.appendChild(locked);
  }
  list.appendChild(item);
});
</script>
</body>
</html>
